services:
  qdrant:
    image: qdrant/qdrant:v1.12.1
    container_name: rag-qdrant
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - ./data/qdrant_storage:/qdrant/storage
    restart: unless-stopped

  # Optional: Uncomment if using Redis instead of Qdrant
  # redis:
